name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install from lockfile
        run: uv sync --all-extras --frozen
      - name: Lint
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Type check
        run: uv run --no-sync mypy
      - name: Test
        run: uv run --no-sync pytest --cov=memograph --cov-report=term-missing --cov-report=xml -m "not integration"
      - name: Build package
        run: uv build
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install real framework SDKs from lockfile
        run: uv sync --all-extras --frozen
      - name: Integration tests
        run: uv run --no-sync pytest -q -m integration

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install docs/API/integration extras
        run: uv sync --all-extras --frozen
      - name: Build published docs
        run: uv run --no-sync mkdocs build --strict

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install npm lockfile
        run: npm ci --prefix sdk/typescript
      - name: TypeScript tests
        run: npm test --prefix sdk/typescript
      - name: TypeScript type check
        run: npm run typecheck --prefix sdk/typescript
