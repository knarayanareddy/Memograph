[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "memograph"
version = "0.1.0"
description = "A self-healing, bandwidth-aware memory system for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Memograph contributors" }]
keywords = ["ai", "agents", "memory", "llm", "context"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "aiosqlite>=0.20",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.9",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.4",
]

[project.scripts]
memograph = "memograph.cli.memograph_cli:main"

[project.urls]
Repository = "https://github.com/knarayanareddy/Memograph"
Issues = "https://github.com/knarayanareddy/Memograph/issues"
Documentation = "https://github.com/knarayanareddy/Memograph/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/memograph"]

[tool.hatch.build.targets.sdist]
include = [
  "src/memograph",
  "tests",
  "docs",
  "examples",
  "README.md",
  "LICENSE",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "CHANGELOG.md",
  "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["docs/archive", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
files = ["src/memograph"]
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false
warn_return_any = false
warn_unused_ignores = false
show_error_codes = true
exclude = "docs/archive"

[tool.coverage.run]
source = ["memograph"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
